<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>timer</title>
  <g stroke="#05070D" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- crown and side button -->
    <rect x="58" y="18" width="12" height="12" fill="#1546B8"/>
    <rect x="50" y="8" width="28" height="12" rx="5" fill="#1E6BFF"/>
    <rect x="94" y="26" width="16" height="12" rx="4" transform="rotate(45 102 32)" fill="#1E6BFF"/>
    <!-- case and face -->
    <circle cx="64" cy="72" r="46" fill="#FFFFFF"/>
    <circle cx="64" cy="72" r="33" fill="#CFEFFF" stroke-width="5"/>
