<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>raids</title>
  <g stroke="#05070D" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
    <!-- sword 1 (shared sword design), tip to the top-right -->
    <g transform="rotate(45 64 64)">
      <path d="M54 84 V30 L64 10 L74 30 V84 Z" fill="#FFFFFF"/>
      <path d="M64 17 L70 30.5 V80 H64 Z" fill="#CFEFFF" stroke="none"/>
      <rect x="57" y="96" width="14" height="14" rx="3" fill="#1546B8"/>
      <rect x="38" y="82" width="52" height="14" rx="7" fill="#1E6BFF"/>
      <circle cx="64" cy="114" r="7" fill="#4FD2FF"/>
    </g>
    <!-- sword 2, tip to the top-left -->
    <g transform="rotate(-45 64 64)">
      <path d="M54 84 V30 L64 10 L74 30 V84 Z" fill="#FFFFFF"/>
      <path d="M64 17 L70 30.5 V80 H64 Z" fill="#CFEFFF" stroke="none"/>
      <rect x="57" y="96" width="14" height="14" rx="3" fill="#1546B8"/>
      <rect x="38" y="82" width="52" height="14" rx="7" fill="#1E6BFF"/>
      <circle cx="64" cy="114" r="7" fill="#4FD2FF"/>
    </g>
